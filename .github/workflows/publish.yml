name: Publish to PyPI

# Publishes on every GitHub release. Uses PyPI Trusted Publishing (OIDC) —
# no API token stored anywhere. Configure the trusted publisher once at
# https://pypi.org/manage/project/greyline/settings/publishing/ with:
#   owner=Jotham-LEC  repo=greyline  workflow=publish.yml  environment=pypi
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0   # no moving `v9` tag is published; pin exact
      # Guard: on a release, the tag (vX.Y.Z) must match pyproject's version, so a
      # mistagged release can't publish the wrong version. Fails before the build.
      - name: Check tag matches pyproject version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(grep -m1 '^version = ' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "release tag: $tag   pyproject version: $ver"
          [ "$tag" = "$ver" ] || { echo "::error::release tag ($tag) != pyproject version ($ver)"; exit 1; }
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for OIDC trusted publishing; nothing else needed
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Submits the RPM to COPR (cothinking/greyline) once the sdist is actually on PyPI.
  # Ordered `needs: publish` deliberately: contrib/greyline.spec builds from the PyPI
  # sdist via %pypi_source, so a COPR webhook firing on the git push would race the
  # upload. Requires one repo secret, COPR_CONFIG, holding the whole ~/.config/copr
  # file generated at https://copr.fedorainfracloud.org/api/ (it expires — a silently
  # expired token is the likely first failure here).
  copr:
    needs: publish
    runs-on: ubuntu-latest
    container: fedora:43
    steps:
      - name: Install build tooling
        run: dnf -y install rpm-build rpmdevtools pyproject-rpm-macros copr-cli git
      - uses: actions/checkout@v7
      # Same guard as the tag check above, one level down: the spec carries its own
      # Version:, so this is the place it can drift from pyproject.toml.
      - name: Check spec version matches pyproject version
        run: |
          spec="$(grep -m1 '^Version:' contrib/greyline.spec | awk '{print $2}')"
          ver="$(grep -m1 '^version = ' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "spec: $spec   pyproject: $ver"
          [ "$spec" = "$ver" ] || { echo "::error::spec version ($spec) != pyproject version ($ver)"; exit 1; }
      - name: Build the SRPM
        run: |
          rpmdev-setuptree
          cp contrib/greyline.spec ~/rpmbuild/SPECS/
          # PyPI's CDN can lag the publish job by a few seconds; retry before failing.
          for attempt in 1 2 3 4 5; do
            if spectool -g -R ~/rpmbuild/SPECS/greyline.spec; then break; fi
            echo "sdist not on PyPI yet (attempt $attempt); retrying in 30s"
            sleep 30
          done
          rpmbuild -bs ~/rpmbuild/SPECS/greyline.spec
      - name: Submit to COPR
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          if [ -z "$COPR_CONFIG" ]; then
            echo "::error::COPR_CONFIG secret is not set"; exit 1
          fi
          install -d -m 700 ~/.config
          printf '%s' "$COPR_CONFIG" > ~/.config/copr
          chmod 600 ~/.config/copr
          copr-cli build cothinking/greyline ~/rpmbuild/SRPMS/*.src.rpm
